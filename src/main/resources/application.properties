# ==============================================================
# CẤU HÌNH HỆ THỐNG QUẢN LÍ NHÀ TRỌ (SPRING BOOT & SQL SERVER)
# ==============================================================
spring.application.name=nhatro
server.port=8080

# Cấu hình kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NhaTroDB;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
# Mật khẩu lấy từ biến môi trường DB_PASSWORD; nếu không có sẽ dùng giá trị mặc định giả lập
# Lưu ý bảo mật: KHÔNG commit mật khẩu thật vào file này
spring.datasource.password=${DB_PASSWORD:default_dummy_password}

# Cấu hình Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Cấu hình Thymeleaf (tắt cache khi dev)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Cấu hình Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8
