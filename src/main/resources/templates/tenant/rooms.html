<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Phòng trống')}"></head>
<body>
<th:block th:replace="~{components :: styles}"></th:block>
<nav th:replace="~{fragments :: navbar('tenant')}"></nav>

<main class="main-container">
    <div class="container-xl">
        <div th:replace="~{fragments :: alerts}"></div>
        <div th:replace="~{components :: tenantTabs('rooms')}"></div>

        <div class="mb-3">
            <h1 class="h3 fw-bold mb-1">Phòng trống</h1>
            <p class="text-muted small mb-0">Các phòng đang sẵn sàng cho thuê. Muốn đặt giữ chỗ, hãy liên hệ quản lý nhà trọ.</p>
        </div>

        <form th:replace="~{components :: searchBar('/tenant/rooms', ${keyword}, 'Tìm theo mã hoặc tên phòng')}"></form>

        <div class="card-custom overflow-hidden">
            <div class="table-responsive">
                <table class="table table-custom align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">Ảnh</th>
                        <th th:replace="~{components :: sortTh('Mã phòng', 'maPhong', '/tenant/rooms')}"></th>
                        <th th:replace="~{components :: sortTh('Tên phòng', 'tenPhong', '/tenant/rooms')}"></th>
                        <th scope="col">Loại phòng</th>
                        <th th:replace="~{components :: sortTh('Diện tích (m²)', 'dienTich', '/tenant/rooms')}"></th>
                        <th th:replace="~{components :: sortTh('Giá thuê (đ/tháng)', 'giaThue', '/tenant/rooms')}"></th>
                        <th scope="col" class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${page.content}">
                        <td>
                            <img class="room-img-thumb" alt=""
                                 th:if="${r.hinhAnh != null and !#strings.isEmpty(r.hinhAnh)}"
                                 th:src="@{${r.hinhAnh}}" onerror="this.style.visibility='hidden'">
                            <div class="room-img-thumb d-flex align-items-center justify-content-center text-muted"
                                 th:unless="${r.hinhAnh != null and !#strings.isEmpty(r.hinhAnh)}">
                                <i class="fa-regular fa-image"></i>
                            </div>
                        </td>
                        <td class="font-mono" th:text="${r.maPhong}">P101</td>
                        <td class="fw-semibold" th:text="${r.tenPhong}">Phòng 101</td>
                        <td th:text="${r.loaiPhong != null} ? ${r.loaiPhong} : '—'">Đơn</td>
                        <td class="font-mono" th:text="${r.dienTich != null} ? ${#numbers.formatDecimal(r.dienTich, 0, 'POINT', 1, 'COMMA')} : '—'">20,0</td>
                        <td class="font-mono fw-semibold text-nowrap" th:text="${#numbers.formatDecimal(r.giaThue, 0, 'POINT', 0, 'COMMA')}">2.200.000</td>
                        <td class="text-end">
                            <a class="btn-action action-view" title="Xem chi tiết" aria-label="Xem chi tiết"
                               th:href="@{/tenant/rooms/{id}(id=${r.id})}"><i class="fa-solid fa-eye"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${page.empty}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <span th:if="${keyword != null and !#strings.isEmpty(keyword)}">Không có phòng trống nào khớp với “<span th:text="${keyword}">từ khóa</span>”. Thử từ khóa khác hoặc xóa bộ lọc.</span>
                            <span th:unless="${keyword != null and !#strings.isEmpty(keyword)}">Hiện chưa có phòng trống. Vui lòng quay lại sau.</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <nav th:replace="~{fragments :: pagination(${page}, '/tenant/rooms', ${keyword}, ${trangThai}, ${sort})}"></nav>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
