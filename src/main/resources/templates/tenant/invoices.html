<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Hóa đơn của tôi')}"></head>
<body>
<th:block th:replace="~{components :: styles}"></th:block>
<nav th:replace="~{layout/fragments :: navbar('tenant')}"></nav>

<main class="main-container">
    <div class="container-xl">
        <div th:replace="~{layout/fragments :: alerts}"></div>
        <div th:replace="~{components :: tenantTabs('invoices')}"></div>

        <div class="mb-3">
            <h1 class="h3 fw-bold mb-1">Hóa đơn của tôi</h1>
            <p class="text-muted small mb-0">Hóa đơn tiền phòng, điện, nước và dịch vụ theo từng tháng.</p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-sm-6">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="stat-icon bg-warning-subtle text-warning"><i class="fa-solid fa-file-invoice"></i></div>
                    <div>
                        <div class="text-muted small">Hóa đơn chưa thanh toán</div>
                        <div class="fs-4 fw-bold font-mono" th:text="${unpaidCount}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="stat-icon bg-danger-subtle text-danger"><i class="fa-solid fa-coins"></i></div>
                    <div>
                        <div class="text-muted small">Số tiền cần thanh toán (đ)</div>
                        <div class="fs-4 fw-bold font-mono" th:text="${#numbers.formatDecimal(unpaidTotal, 0, 'POINT', 0, 'COMMA')}">0</div>
                    </div>
                </div>
            </div>
        </div>

        <form method="get" th:action="@{/tenant/invoices}" class="d-flex flex-wrap align-items-center gap-2 mb-3">
            <label for="trangThai" class="form-label mb-0">Trạng thái</label>
            <select id="trangThai" name="trangThai" class="form-select w-auto" onchange="this.form.submit()">
                <option value="" th:selected="${trangThai == null or trangThai == ''}">Tất cả</option>
                <option value="CHUA_THANH_TOAN" th:selected="${trangThai == 'CHUA_THANH_TOAN'}">Chưa thanh toán</option>
                <option value="DA_THANH_TOAN" th:selected="${trangThai == 'DA_THANH_TOAN'}">Đã thanh toán</option>
            </select>
            <noscript><button type="submit" class="btn btn-primary btn-sm">Lọc</button></noscript>
        </form>

        <div class="card-custom overflow-hidden">
            <div class="table-responsive">
                <table class="table table-custom align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">Mã hóa đơn</th>
                        <th scope="col">Kỳ</th>
                        <th scope="col">Phòng</th>
                        <th th:replace="~{components :: sortTh('Tổng tiền (đ)', 'tongTien', '/tenant/invoices')}"></th>
                        <th scope="col">Trạng thái</th>
                        <th th:replace="~{components :: sortTh('Ngày lập', 'ngayLap', '/tenant/invoices')}"></th>
                        <th scope="col" class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="hd : ${page.content}">
                        <td class="font-mono" th:text="${hd.maHoaDon}">HDON-202609-01</td>
                        <td class="font-mono" th:text="${hd.thangNam}">09/2026</td>
                        <td th:text="${hd.hopDong.phongTro.tenPhong}">Phòng 102</td>
                        <td class="font-mono fw-semibold text-nowrap" th:text="${#numbers.formatDecimal(hd.tongTien, 0, 'POINT', 0, 'COMMA')}">3.140.000</td>
                        <td><th:block th:replace="~{components :: statusBadge(${hd.trangThai})}"></th:block></td>
                        <td class="font-mono" th:text="${#temporals.format(hd.ngayLap, 'dd/MM/yyyy')}">30/09/2026</td>
                        <td class="text-end">
                            <a class="btn-action action-view" title="Xem chi tiết" aria-label="Xem chi tiết"
                               th:href="@{/tenant/invoices/{id}(id=${hd.id})}"><i class="fa-solid fa-eye"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${page.empty}">
                        <td colspan="7" class="text-center text-muted py-5">Chưa có hóa đơn nào phù hợp.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <nav th:replace="~{layout/fragments :: pagination(${page}, '/tenant/invoices', ${keyword}, ${trangThai}, ${sort})}"></nav>
    </div>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<th:block th:replace="~{layout/fragments :: scripts}"></th:block>
</body>
</html>
