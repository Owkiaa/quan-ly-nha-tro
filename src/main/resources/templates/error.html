<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Thông Báo Hệ Thống')}"></head>
<body>

    <nav th:replace="~{layout/fragments :: navbar('')}"></nav>

    <main class="main-container d-flex align-items-center">
        <div class="container-xl">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card-custom p-4 p-md-5 text-center">
                        <div class="rounded-circle bg-warning-subtle text-warning d-inline-flex align-items-center justify-content-center mb-3"
                             style="width: 72px; height: 72px; font-size: 2rem;">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>

                        <div class="badge bg-amber-subtle text-amber border border-warning-subtle px-3 py-2 rounded-pill mb-3 font-mono"
                             th:text="'Mã phản hồi HTTP ' + (${errorCode != null ? errorCode : (status != null ? status : 500)})">
                            Mã phản hồi HTTP 500
                        </div>

                        <h4 class="fw-bold mb-2"
                            th:text="${errorTitle != null ? errorTitle : (status == 404 ? 'Không tìm thấy trang yêu cầu' : 'Không thể hoàn tất yêu cầu')}">
                            Không thể hoàn tất yêu cầu
                        </h4>

                        <p class="text-muted mb-4"
                           th:text="${errorMessage != null ? errorMessage : (message != null and !#strings.isEmpty(message) ? message : 'Đường dẫn không tồn tại hoặc dữ liệu yêu cầu không hợp lệ. Vui lòng kiểm tra lại.')}">
                            Đường dẫn không tồn tại hoặc dữ liệu yêu cầu không hợp lệ. Vui lòng kiểm tra lại.
                        </p>

                        <div th:if="${requestUri != null or path != null}"
                             class="bg-light border rounded-3 py-2 px-3 small text-secondary font-mono mb-4">
                            Đường dẫn: <span th:text="${requestUri != null ? requestUri : path}">/</span>
                        </div>

                        <div class="d-flex justify-content-center gap-2 flex-wrap">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                            </a>
                            <a th:href="@{/}" class="btn btn-primary-custom px-4">
                                <i class="fa-solid fa-house me-1"></i> Về trang chính
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/fragments :: footer}"></footer>
    <th:block th:replace="~{layout/fragments :: scripts}"></th:block>
</body>
</html>
