name: Java CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and run unit tests
        run: chmod +x mvnw && ./mvnw -B test-compile test '-Dtest=!ConcurrencyBookingTest'

      - name: Compile Socket Desktop Client
        run: |
          mkdir -p client/out
          javac -encoding UTF-8 -d client/out client/src/com/nhatro/client/*.java
